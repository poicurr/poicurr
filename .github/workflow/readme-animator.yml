name: Update daily art
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - scripts/generate_daily_svg.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install deps
        run: pip install --upgrade pillow
      - name: Generate assets
        run: python scripts/generate_daily_svg.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/daily.svg assets/daily_animated.svg || true
          git add assets/daily.gif || true
          git diff --staged --quiet || git commit -m "chore: update daily assets"
      - name: Push
        run: git push
